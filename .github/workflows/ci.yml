name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      # The third-party recordings are not committed; run the self-contained tests only.
      - run: npm test
        env:
          LEADLINE_ALLOW_MISSING_DATA: '1'
      - run: npm run build
